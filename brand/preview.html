<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonora — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:ital,wght@0,500;0,700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Sora, 'Segoe UI', sans-serif; background: #F5F7FC; color: #09124F; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; } p { margin: 0 0 28px; color: #4a5585; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; margin: 36px 0 12px; color: #16266D; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  figure { margin: 0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px #09124f1f; }
  figure > div { height: 200px; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
  figure img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
  figcaption { font-size: 13px; padding: 10px 14px; border-top: 1px solid #e6e9f4; }
  .dark { background: #09124F; } .light { background: #fff; } .blue { background: #4169E1; }
  .wide figure > div { height: 180px; }
  .wide { grid-template-columns: 1fr; }
  .sizes { display: flex; align-items: end; gap: 20px; flex-wrap: wrap; background: #fff; padding: 20px; border-radius: 14px; }
  .sizes span { display: block; font-size: 11px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Sonora: símbolo vetorial</h1>
  <p>S itálico com onda sonora no centro. Todos os arquivos estão em <code>brand/logo/</code>.</p>

  <h2>Símbolo</h2>
  <div class="grid">
    <figure><div class="dark"><img src="logo/simbolo-branco.svg"></div><figcaption>simbolo-branco.svg</figcaption></figure>
    <figure><div class="light"><img src="logo/simbolo-navy.svg"></div><figcaption>simbolo-navy.svg</figcaption></figure>
    <figure><div class="light"><img src="logo/simbolo-navy-destaque.svg"></div><figcaption>simbolo-navy-destaque.svg (centro em azul)</figcaption></figure>
    <figure><div class="blue"><img src="logo/simbolo-branco.svg"></div><figcaption>branco sobre Blue</figcaption></figure>
    <figure><div class="light"><img src="logo/simbolo-preto.svg"></div><figcaption>simbolo-preto.svg (1 cor / impressão)</figcaption></figure>
  </div>

  <h2>Ícones</h2>
  <div class="grid">
    <figure><div class="light"><img src="logo/icone-app.svg"></div><figcaption>icone-app.svg</figcaption></figure>
    <figure><div class="light"><img src="logo/icone-app-brilho.svg"></div><figcaption>icone-app-brilho.svg (como o conceito)</figcaption></figure>
    <figure><div class="light"><img src="logo/favicon.svg"></div><figcaption>favicon.svg (onda simplificada)</figcaption></figure>
  </div>

  <h2>Tamanhos pequenos</h2>
  <div class="sizes">
    <div><img src="logo/icone-app.svg" width="64"><span>completo 64</span></div>
    <div><img src="logo/icone-app.svg" width="32"><span>completo 32</span></div>
    <div><img src="logo/icone-app.svg" width="16"><span>completo 16</span></div>
    <div><img src="logo/favicon.svg" width="64"><span>favicon 64</span></div>
    <div><img src="logo/favicon.svg" width="32"><span>favicon 32</span></div>
    <div><img src="logo/favicon.svg" width="16"><span>favicon 16</span></div>
  </div>

  <h2>Logo horizontal</h2>
  <div class="grid wide">
    <figure><div class="light"><img src="logo/logo-horizontal-claro.svg"></div><figcaption>logo-horizontal-claro.svg</figcaption></figure>
    <figure><div class="dark"><img src="logo/logo-horizontal-escuro.svg"></div><figcaption>logo-horizontal-escuro.svg</figcaption></figure>
  </div>
</main>
</body>
</html>
