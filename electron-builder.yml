appId: br.app.sonora
productName: Sonora
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bible
    to: bible
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
